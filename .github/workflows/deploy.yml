name: deploy

# Reusable deploy: SSH (pinned host key) to the server and run servers/deploy.sh, which pulls and
# restarts only <service>, waits for its healthcheck and rolls back to the previous tag on failure.
# If the calling repo has deploy/<environment>/ (values.yaml, SOPS-encrypted secrets.yaml), that
# folder is sent along still encrypted; the server decrypts it with its own age key.

on:
  workflow_call:
    inputs:
      service:
        description: Compose service name, e.g. "backend". Its tag variable is <SERVICE>_TAG.
        type: string
        required: true
      image-tag:
        description: Image tag to deploy (normally the commit SHA output of docker-publish).
        type: string
        required: true
      environment:
        description: GitHub Environment and server environment, e.g. "staging" or "production".
        type: string
        required: true
      config-format:
        description: >-
          How deploy/<environment>/ is rendered on the server. "env": values.yaml + secrets.yaml
          become the container's environment. "json": values.yaml becomes a public config.json
          (frontends), secrets.yaml is rejected.
        type: string
        default: env
      deploy-script:
        description: Absolute path of deploy.sh on the server.
        type: string
        default: /opt/voidmails/deploy.sh
    # These are GitHub Environment secrets. Because the job below sets `environment:`, GitHub
    # resolves them from that environment of the calling repository.
    secrets:
      DEPLOY_SSH_KEY:
        description: Private SSH key (ed25519) of the deploy user.
        required: true
      DEPLOY_HOST:
        description: Server hostname or IP. Must match the host field in DEPLOY_KNOWN_HOSTS.
        required: true
      DEPLOY_USER:
        description: SSH user on the server, e.g. "deploy".
        required: true
      DEPLOY_KNOWN_HOSTS:
        description: known_hosts line(s) for DEPLOY_HOST, taken from the server's host key.
        required: true

permissions: {}

jobs:
  deploy:
    name: ${{ inputs.service }} → ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}-${{ inputs.service }}
      cancel-in-progress: false
    env:
      SERVICE: ${{ inputs.service }}
      IMAGE_TAG: ${{ inputs.image-tag }}
      TARGET_ENV: ${{ inputs.environment }}
      CONFIG_FORMAT: ${{ inputs.config-format }}
      DEPLOY_SCRIPT: ${{ inputs.deploy-script }}
    steps:
      - name: Validate inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$SERVICE" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || fail "invalid service '$SERVICE'"
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || fail "invalid image-tag '$IMAGE_TAG'"
          [[ "$TARGET_ENV" =~ ^[a-z0-9][a-z0-9-]{0,30}$ ]] || fail "invalid environment '$TARGET_ENV'"
          [[ "$CONFIG_FORMAT" =~ ^(env|json)$ ]] || fail "invalid config-format '$CONFIG_FORMAT' (env or json)"
          [[ "$DEPLOY_SCRIPT" =~ ^/[A-Za-z0-9_./-]+$ ]] || fail "invalid deploy-script '$DEPLOY_SCRIPT'"

      # Same commit as the image, so config and code are deployed (and re-run) together.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: deploy

      - name: Package deploy/${{ inputs.environment }}
        id: config
        run: |
          fail() { echo "::error::$1"; exit 1; }
          dir="deploy/$TARGET_ENV"
          if [[ ! -d "$dir" ]]; then
            echo "No $dir/ in this repo: the server keeps its current config for $SERVICE."
            echo "bundle=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          extra="$(find "$dir" -mindepth 1 ! -name values.yaml ! -name secrets.yaml)"
          [[ -z "$extra" ]] || fail "only values.yaml and secrets.yaml are allowed in $dir/, found: $extra"
          files=()
          if [[ -f "$dir/values.yaml" ]]; then files+=(values.yaml); fi
          if [[ -f "$dir/secrets.yaml" ]]; then
            [[ "$CONFIG_FORMAT" == env ]] || fail "$dir/secrets.yaml: config-format json is public, secrets are not allowed"
            grep -q '^sops:' "$dir/secrets.yaml" || fail "$dir/secrets.yaml is not encrypted with sops"
            files+=(secrets.yaml)
          fi
          (( ${#files[@]} > 0 )) || fail "$dir/ has neither values.yaml nor secrets.yaml"
          tar -czf "$RUNNER_TEMP/config.tgz" -C "$dir" "${files[@]}"
          echo "Sending ${files[*]} from $dir/ (secrets stay encrypted until the server)."
          echo "bundle=$RUNNER_TEMP/config.tgz" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER; do
            [[ -n "${!name}" ]] || { echo "::error::Secret $name is empty in environment '$TARGET_ENV'"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BUNDLE: ${{ steps.config.outputs.bundle }}
        run: |
          cmd=("$DEPLOY_SCRIPT" "$SERVICE" "$IMAGE_TAG" "$TARGET_ENV")
          input=/dev/null
          if [[ -n "$BUNDLE" ]]; then
            cmd+=("--config=$CONFIG_FORMAT")
            input="$BUNDLE"
          fi
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${cmd[@]}" <"$input"

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          echo "### Deploy \`${SERVICE}\` → \`${TARGET_ENV}\`: ${OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- image tag: \`${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$OUTCOME" != success ]]; then
            echo "- The server rolled back to the previous tag if one existed. See the Deploy step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
