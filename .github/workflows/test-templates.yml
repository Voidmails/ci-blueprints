name: test-templates

# Self-test for the blueprints: lint everything, then run each reusable workflow against the tiny
# sample projects in examples/ and run servers/deploy.sh end to end against a local registry.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (actionlint, yamllint, shellcheck, compose, caddy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
          .github/workflows/*.yml examples/consumers/*/ci.yml

      - name: yamllint
        run: yamllint --strict .

      - name: shellcheck
        run: shellcheck servers/deploy.sh examples/deploy-test/run-tests.sh

      - name: docker compose config
        working-directory: servers
        run: |
          for env in production staging; do
            docker compose -p "voidmails-$env" --env-file "$env.env.example" config --quiet
          done

      - name: Caddyfile validate
        run: >-
          docker run --rm -e BASE_DOMAIN=example.com -e ACME_EMAIL=ops@example.com
          -v "$PWD/servers/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  node-backend:
    uses: ./.github/workflows/node-ci.yml
    permissions:
      contents: read
    with:
      working-directory: examples/node-backend
      lint-command: npm run lint

  static-web:
    uses: ./.github/workflows/node-ci.yml
    permissions:
      contents: read
    with:
      working-directory: examples/static-web
      lint-command: npm run lint

  flutter-web:
    uses: ./.github/workflows/flutter-ci.yml
    permissions:
      contents: read
    with:
      flutter-version: "3.47.8"
      working-directory: examples/flutter-web

  docker-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: examples/node-backend
          - name: landing
            context: examples/static-web
          - name: frontend
            context: examples/flutter-web
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      image-name: ci-blueprints-test-${{ matrix.name }}
      context: ${{ matrix.context }}
      push: false

  deploy-script:
    name: deploy.sh end-to-end (rollback)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install sops and age (checksum-pinned)
        env:
          SOPS_VERSION: v3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  sops" | sha256sum -c -
          curl -fsSL -o age.tgz "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  age.tgz" | sha256sum -c -
          tar -xzf age.tgz
          sudo install -m 755 sops age/age age/age-keygen /usr/local/bin/
          python3 -c 'import yaml' || sudo apt-get install -y python3-yaml

      - run: examples/deploy-test/run-tests.sh
