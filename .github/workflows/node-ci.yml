name: node-ci

# Reusable CI for Node.js projects (NestJS, React/Vite, ...): install, lint, test, build.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for actions/setup-node.
        type: string
        default: "24"
      working-directory:
        description: Directory that contains package.json.
        type: string
        default: "."
      install-command:
        type: string
        default: npm ci
      lint-command:
        description: Lint command. Empty skips the step.
        type: string
        default: ""
      test-command:
        description: Test command. Empty skips the step.
        type: string
        default: npm test
      build-command:
        description: Build command. Empty skips the step.
        type: string
        default: npm run build
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  ci:
    name: lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check deploy secrets are encrypted
        working-directory: ${{ github.workspace }}
        run: |
          git ls-files -z ':(glob)**/deploy/*/secrets.yaml' | while IFS= read -r -d '' f; do
            grep -q '^sops:' "$f" || { echo "::error file=$f::$f is not encrypted with sops"; exit 1; }
          done

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install
        run: ${{ inputs.install-command }}

      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
