# Minimal stand-in for servers/docker-compose.yml, used by run-tests.sh.
services:
  sample:
    image: localhost:5000/deploy-sample:${SAMPLE_TAG:-v1}
    restart: unless-stopped
    env_file:
      - path: ./env/${ENV_NAME}/sample.env
        format: raw
        required: false
    healthcheck:
      # BROKEN=1 in the deployed config simulates a bad configuration.
      test: ["CMD-SHELL", "test -f /healthy && test -z \"$$BROKEN\""]
      interval: 1s
      timeout: 2s
      retries: 3
      start_period: 1s
