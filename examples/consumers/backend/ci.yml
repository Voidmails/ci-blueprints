# Copy to a Backend repo (NestJS, one service per repo) as .github/workflows/ci.yml.
# Pull request: lint, test, build. Push to dev: deploy to staging.
# Push to main: deploy to production (waits for approval). Branch rules: require "ci-ok".
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: github.event_name == 'pull_request'
    uses: Voidmails/ci-blueprints/.github/workflows/node-ci.yml@v1
    permissions:
      contents: read
    with:
      node-version: "24"
      lint-command: npm run lint

  ci-ok:
    if: always() && github.event_name == 'pull_request'
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]

  publish:
    if: github.event_name == 'push'
    uses: Voidmails/ci-blueprints/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      image-name: backend

  deploy:
    needs: publish
    uses: Voidmails/ci-blueprints/.github/workflows/deploy.yml@v1
    permissions:
      contents: read
    with:
      service: backend
      environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      image-tag: ${{ needs.publish.outputs.image-tag }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
